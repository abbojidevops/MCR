name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # The PostgreSQL integration tests connect to 127.0.0.1:5433 using
    # the isolated credentials below. GitHub Actions service containers
    # expose container port 5432 on that host port.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcr_user
          POSTGRES_PASSWORD: 'McrSecurePostgresPass2026!DbEngine'
          POSTGRES_DB: mcr_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mcr_user -d mcr_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      # Validates the Railway staging topology (Dockerfile builder, db-init pre-deploy
      # schema migration, npm start, /api/health healthcheck) and secret strength.
      # Values below are throwaway CI-only fixtures, never real credentials.
      - name: Staging Pre-flight Verification
        env:
          ADMIN_PASSWORD: 'CiPreflightAdmin2026!'
          SESSION_SECRET: 'ci-preflight-session-secret-32-chars-min'
          DATABASE_URL: 'postgresql://mcr_user:McrSecurePostgresPass2026!DbEngine@127.0.0.1:5433/mcr_db'
          NEXT_PUBLIC_APP_URL: 'https://mcr-staging.up.railway.app'
          TWILIO_MOCK_MODE: 'true'
        run: npm run staging:preflight

      - name: Build Next.js Production App
        run: npm run build

      # Full deployment gate: hygiene invariance, green security probes, and the
      # assertion that probe:red still fails on the fixed build.
      - name: Deployment, Hygiene & Security Probe Gate
        run: npm run deploy:check
