version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcr-saas-app
    restart: unless-stopped
    command: sh -c "node scripts/db-init.mjs && npm start"
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://mcr_user:mcr_password@postgres:5432/mcr_db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - TWILIO_MOCK_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mcr_data:/app/data

  postgres:
    image: postgres:16-alpine
    container_name: mcr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcr_user
      POSTGRES_PASSWORD: mcr_password
      POSTGRES_DB: mcr_db
    # Security requirement: No database port published to the host
    expose:
      - '5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcr_user -d mcr_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mcr_data:
  pg_data:
