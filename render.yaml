services:
  - type: web
    name: mcr-saas-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: ohio
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: mcr-postgres
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: TWILIO_MOCK_MODE
        value: "true"

databases:
  - name: mcr-postgres
    plan: standard
    databaseName: mcr_db
    user: mcr_user
    region: ohio
    postgresMajorVersion: 16
